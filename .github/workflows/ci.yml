name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor the plugin promises; 24 is what it is developed
        # against. Both are verified, because Claude Code ships as a native
        # binary and brings no Node of its own — whatever the user has
        # installed is what runs the hook.
        node: [22, 24]

    name: node ${{ matrix.node }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2  # the version guard below compares against the parent commit

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      # `npm install`, not `npm ci`: there is deliberately no lockfile. See
      # .gitignore for why. Every devDependency is pinned to an exact version,
      # and the dist/ drift check below catches any toolchain surprise.
      - run: npm install --no-audit --no-fund

      # A lockfile here would make Claude Code install 43 MB into every user's
      # plugin cache for nothing.
      - name: No lockfile at the plugin root
        run: |
          if git ls-files --error-unmatch package-lock.json npm-shrinkwrap.json \
               yarn.lock pnpm-lock.yaml bun.lock bun.lockb 2>/dev/null; then
            echo "A lockfile is tracked. Claude Code would then npm ci into every"
            echo "user's plugin cache. Remove it — see the note in .gitignore."
            exit 1
          fi
          echo "No lockfile tracked."

      # Runs before anything else that could hide it. A pull request carrying a
      # credential or someone's prompt text fails here, whether or not the
      # author had the local pre-commit hook installed — `--no-verify` skips the
      # hook, not this.
      - name: Leak scan
        run: npm run check-leaks

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # dist/ is committed so the plugin needs no install step: Claude Code runs
      # npm ci with --ignore-scripts, so no build ever happens at install time,
      # and without dist/ the hook would have nothing to execute. That only
      # works if the committed bundle matches the source.
      - name: dist/ is in sync with src/
        run: |
          if ! git diff --quiet -- dist; then
            echo "dist/ does not match a fresh build of src/. Run 'npm run build' and commit the result."
            git diff --stat -- dist
            exit 1
          fi

      # Redaction and the hook's wire behaviour. No API key, no external network.
      - name: Tests
        run: npm run test:unit

  # `claude plugin update` compares the version string in plugin.json. Ship a
  # changed bundle under an unchanged version and every existing install reports
  # "already at the latest version" and silently keeps running the old code.
  version-bumped:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: A changed dist/ requires a new plugin version
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1 && ! git diff --quiet HEAD~1 HEAD -- dist; then
            before=$(git show HEAD~1:.claude-plugin/plugin.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
            after=$(node -p "require('./.claude-plugin/plugin.json').version")
            if [ "$before" = "$after" ]; then
              echo "dist/ changed but .claude-plugin/plugin.json is still $after."
              echo "Existing installs compare that string and would never fetch this build."
              exit 1
            fi
            echo "dist/ changed and the version moved $before -> $after."
          else
            echo "dist/ unchanged; no version bump needed."
          fi
